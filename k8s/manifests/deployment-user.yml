# ============================================
# NAMESPACE
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: habit-tracker

---
# ConfigMap for service discovery
apiVersion: v1
kind: ConfigMap
metadata:
  name: habit-tracker-config
  namespace: habit-tracker
data:
  USER_SERVICE_URL: "http://user-service:3001"
  NODE_ENV: "production"

---
# ============================================
# MONGODB for User Service
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-user
  namespace: habit-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-user
  template:
    metadata:
      labels:
        app: mongodb-user
    spec:
      containers:
      - name: mongodb
        image: mongo:6
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password123"
        - name: MONGO_INITDB_DATABASE
          value: "habit-tracker-users"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-user
  namespace: habit-tracker
spec:
  selector:
    app: mongodb-user
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP

---
# ============================================
# USER SERVICE
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: habit-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: pateldarsh21/habit-tracker:user-service-v3
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          value: "mongodb://admin:password123@mongodb-user:27017/habit-tracker-users?authSource=admin"
        - name: JWT_SECRET
          value: "habit-tracker-secret-key-change-in-production"
        - name: JWT_EXPIRES_IN
          value: "7d"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: habit-tracker
spec:
  selector:
    app: user-service
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP

---
# ============================================
# API GATEWAY
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: habit-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: pateldarsh21/habit-tracker:api-gateway-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: habit-tracker-config
              key: USER_SERVICE_URL
        - name: JWT_SECRET
          value: "habit-tracker-secret-key-change-in-production"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: habit-tracker
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

---
# ============================================
# FRONTEND (React App)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: habit-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: pateldarsh21/habit-tracker:frontend-v3
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "http://localhost:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: habit-tracker
spec:
  selector:
    app: frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

---
# ============================================
# INGRESS (External Access)
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker-ingress
  namespace: habit-tracker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: habit-tracker.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 3000
