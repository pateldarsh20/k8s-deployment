# ============================================
# HABIT TRACKER - FULL KUBERNETES DEPLOYMENT
# ============================================

# ============================================
# NAMESPACE
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: habit-tracker

---
# ============================================
# CONFIGMAP - Service URLs & Configuration
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: habit-tracker-config
  namespace: habit-tracker
data:
  # Service URLs (internal K8s DNS)
  USER_SERVICE_URL: "http://user-service:3001"
  HABIT_SERVICE_URL: "http://habit-service:3002"
  TRACKING_SERVICE_URL: "http://tracking-service:3003"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3005"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"

  # Environment
  NODE_ENV: "production"

---
# ============================================
# RABBITMQ (Message Queue)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: habit-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "guest"
        - name: RABBITMQ_DEFAULT_PASS
          value: "guest"
        livenessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: habit-tracker
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  type: ClusterIP

---
# ============================================
# MONGODB - USER SERVICE
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-user
  namespace: habit-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-user
  template:
    metadata:
      labels:
        app: mongodb-user
    spec:
      containers:
      - name: mongodb
        image: mongo:6
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password123"
        - name: MONGO_INITDB_DATABASE
          value: "habit-tracker-users"
        volumeMounts:
        - name: mongo-user-storage
          mountPath: /data/db
      volumes:
      - name: mongo-user-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-user
  namespace: habit-tracker
spec:
  selector:
    app: mongodb-user
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP

---
# ============================================
# MONGODB - HABIT SERVICE
