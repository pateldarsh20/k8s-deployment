---
# ============================================
# USER SERVICE
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: habit-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: pateldarsh21/habit-tracker:user-service-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: MONGODB_URI
          value: "mongodb://admin:password123@mongodb-user:27017/habit-tracker-users?authSource=admin"
        - name: JWT_SECRET
          value: "habit-tracker-secret-key-change-in-production"
        - name: JWT_EXPIRES_IN
          value: "7d"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: habit-tracker-config
              key: RABBITMQ_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: habit-tracker
spec:
  selector:
    app: user-service
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP

