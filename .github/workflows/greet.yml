# .github/workflows/greet.yml

name: Greet New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hey @${{ github.actor }}! Thanks for opening your first issue!
            We'll look into this soon.
          pr-message: |
            🎉 Congrats on your first PR, @${{ github.actor }}!
            Someone will review this shortly.