---
# ==================== API GATEWAY HPA ====================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: habit-tracker
spec:
  # =========================================
  # SECTION 1: SCALE TARGET REFERENCE
  # =========================================
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  
  # =========================================
  # SECTION 2: MIN/MAX REPLICAS
  # =========================================
  minReplicas: 3
  maxReplicas: 15
  
  # =========================================
  # SECTION 3: METRICS
  # =========================================
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 150
  - type: Pods
    pods:
      metric:
        name: http_request_duration_p95_ms
      target:
        type: AverageValue
        averageValue: 300
  
  # =========================================
  # SECTION 4: SCALING BEHAVIOR
  # =========================================
  behavior:
    # ========== SCALE DOWN ==========
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    # ========== SCALE UP ==========
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

