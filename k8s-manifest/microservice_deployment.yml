---
# ==================== USER SERVICE ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: habit-tracker
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      restartPolicy: Always
      containers:
        - name: user-service
          image: pateldarsh21/habit-tracker:user-service-v6
          ports:
            - containerPort: 3001
          
          # =========================================
          # FEATURE 1: RESOURCES (Requests & Limits)
          # =========================================
          # Purpose: Guarantees minimum CPU/Memory and sets maximum limits
          # Without this: Pod can consume all node resources, crash other pods
          resources:
            requests:
              cpu: "100m"      # Guaranteed 0.1 CPU core
              memory: "128Mi"  # Guaranteed 128 MB RAM
            limits:
              cpu: "500m"      # Max 0.5 CPU core (can't exceed)
              memory: "256Mi"  # Max 256 MB RAM (will OOM kill if exceeded)
          
          # =========================================
          # FEATURE 2: STARTUP PROBE
          # =========================================
          # Purpose: Gives slow-starting apps time to initialize
          # Without this: Liveness probe may kill pod during slow startup
          # When it runs: Only during pod startup
          # On failure: Pod restarts
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 0      # Start checking immediately
            periodSeconds: 5             # Check every 5 seconds
            failureThreshold: 30         # Allow 30 failures (150 seconds total)
            timeoutSeconds: 2            # Must respond within 2 seconds
          
          # =========================================
          # FEATURE 3: READINESS PROBE
          # =========================================
          # Purpose: Determines if pod can receive traffic
          # Without this: Traffic sent to unprepared pods → 502 errors
          # When it runs: Forever (after startupProbe succeeds)
          # On failure: Traffic stops, pod NOT restarted
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 0       # startupProbe handles initial delay
            periodSeconds: 10            # Check every 10 seconds
            timeoutSeconds: 2            # Must respond within 2 seconds
            failureThreshold: 3          # 3 failures = Not Ready (traffic stops)
            successThreshold: 1          # 1 success = Ready (traffic resumes)
          
          # =========================================
          # FEATURE 4: LIVENESS PROBE
          # =========================================
          # Purpose: Detects and restarts hung/dead pods
          # Without this: Hang pod runs forever, never recovers
          # When it runs: Forever (after startupProbe succeeds)
          # On failure: Pod RESTARTS
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30      # Wait 30s after startup before starting
            periodSeconds: 30            # Check every 30 seconds
            timeoutSeconds: 2            # Must respond within 2 seconds
            failureThreshold: 3          # 3 failures = Pod restarts
          
          # =========================================
          # FEATURE 5: PRE-STOP HOOK
          # =========================================
          # Purpose: Runs custom code BEFORE pod terminates
          # Without this: In-flight requests get interrupted → 502 errors
          # When it runs: Immediately after termination signal
          # What it does: Sleeps to finish existing requests
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - "sleep 10"            # Wait 10 seconds for requests to finish
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              value: "mongodb://mongodb-users:27017/habit-tracker-users"
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: habit-tracker-config
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
      
      # =========================================
      # FEATURE 6: TERMINATION GRACE PERIOD
      # =========================================
      # Purpose: Total time Kubernetes waits before force kill
      # Without this: Default 30s may not be enough (pod gets force killed)
      # Formula: Must be > preStop sleep + app shutdown time
      terminationGracePeriodSeconds: 45   # Total: 10s (preStop) + 35s buffer

