---
# ==================== API GATEWAY ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: habit-tracker
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      restartPolicy: Always
      containers:
        - name: api-gateway
          image: pateldarsh21/habit-tracker:api-gateway-v10
          ports:
            - containerPort: 3000
          
          # =========================================
          # FEATURE 1: RESOURCES
          # =========================================
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          
          # =========================================
          # FEATURE 2: STARTUP PROBE
          # =========================================
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
          
          # =========================================
          # FEATURE 3: READINESS PROBE
          # =========================================
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          
          # =========================================
          # FEATURE 4: LIVENESS PROBE
          # =========================================
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          
          # =========================================
          # FEATURE 5: PRE-STOP HOOK (Longer for API gateway)
          # =========================================
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - |
                  echo "🛑 Draining API gateway connections..."
                  sleep 15
                  echo "✅ Ready to exit"
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: habit-tracker-config
                  key: JWT_SECRET
            - name: USER_SERVICE_URL
              value: "http://user-service:3001"
            - name: HABIT_SERVICE_URL
              value: "http://habit-service:3002"
            - name: TRACKING_SERVICE_URL
              value: "http://tracking-service:3003"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service:3004"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3005"
            - name: RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: habit-tracker-config
                  key: RATE_LIMIT_WINDOW_MS
            - name: RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: habit-tracker-config
                  key: RATE_LIMIT_MAX_REQUESTS
      
      # =========================================
      # FEATURE 6: TERMINATION GRACE PERIOD (Longer for API gateway)
      # =========================================
      terminationGracePeriodSeconds: 60

---
# ==================== FRONTEND ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: habit-tracker
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      restartPolicy: Always
      containers:
        - name: frontend
          image: pateldarsh21/habit-tracker:frontend-v3
          ports:
            - containerPort: 3000
          
          # =========================================
          # FEATURE 1: RESOURCES
          # =========================================
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          
          # =========================================
          # FEATURE 2: STARTUP PROBE (Uses / path for static frontend)
          # =========================================
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
          
          # =========================================
          # FEATURE 3: READINESS PROBE
          # =========================================
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          
          # =========================================
          # FEATURE 4: LIVENESS PROBE
          # =========================================
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          
          # =========================================
          # FEATURE 5: PRE-STOP HOOK (NOT NEEDED for static frontend)
          # =========================================
          # No preStop hook - static files don't need graceful shutdown
          
          env: []
      
      # =========================================
      # FEATURE 6: TERMINATION GRACE PERIOD (Shorter for frontend)
      # =========================================
      terminationGracePeriodSeconds: 30