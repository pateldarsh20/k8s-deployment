---
# ==================== ANALYTICS SERVICE ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: habit-tracker
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      restartPolicy: Always
      containers:
        - name: analytics-service
          image: pateldarsh21/habit-tracker:analytics-service-v6
          ports:
            - containerPort: 3004
          
          # =========================================
          # FEATURE 1: RESOURCES (Higher for analytics)
          # =========================================
          resources:
            requests:
              cpu: "200m"      # Higher CPU for batch processing
              memory: "256Mi"  # Higher memory
            limits:
              cpu: "1000m"     # Can burst to 1 full core
              memory: "512Mi"
          
          # =========================================
          # FEATURE 2: STARTUP PROBE (Slower for analytics)
          # =========================================
          startupProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3    # Longer timeout
          
          # =========================================
          # FEATURE 3: READINESS PROBE
          # =========================================
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          # =========================================
          # FEATURE 4: LIVENESS PROBE (Delayed for analytics)
          # =========================================
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 45   # Longer delay for heavy service
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          
          # =========================================
          # FEATURE 5: PRE-STOP HOOK (Longer for analytics)
          # =========================================
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - |
                  echo "🛑 Finishing analytics batch processing..."
                  sleep 30
                  echo "✅ Ready to exit"
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3004"
            - name: MONGODB_URI
              value: "mongodb://mongodb-analytics:27017/habit-tracker-analytics"
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: habit-tracker-config
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
      
      # =========================================
      # FEATURE 6: TERMINATION GRACE PERIOD (Longer for analytics)
      # =========================================
      terminationGracePeriodSeconds: 90

