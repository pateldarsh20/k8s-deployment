---
# ==================== RABBITMQ ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: habit-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: mgmt
          
          # =========================================
          # FEATURE 1: RESOURCES (Requests & Limits)
          # =========================================
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          # =========================================
          # FEATURE 2: STARTUP PROBE
          # =========================================
          startupProbe:
            exec:
              command:
              - rabbitmq-diagnostics
              - ping
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          
          # =========================================
          # FEATURE 3: READINESS PROBE
          # =========================================
          readinessProbe:
            exec:
              command:
              - rabbitmq-diagnostics
              - ping
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # =========================================
          # FEATURE 4: LIVENESS PROBE
          # =========================================
          livenessProbe:
            exec:
              command:
              - rabbitmq-diagnostics
              - status
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          # =========================================
          # FEATURE 5: PRE-STOP HOOK
          # =========================================
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - |
                  echo "🛑 Stopping RabbitMQ gracefully..."
                  rabbitmqctl stop_app
                  sleep 5
                  echo "✅ RabbitMQ stopped"
          
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
      
      # =========================================
      # FEATURE 6: TERMINATION GRACE PERIOD
      # =========================================
      terminationGracePeriodSeconds: 90

---
# ==================== MONGODB USERS ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-users
  namespace: habit-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-users
  template:
    metadata:
      labels:
        app: mongodb-users
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          
          # =========================================
          # FEATURE 1: RESOURCES (Requests & Limits)
          # =========================================
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          
          # =========================================
          # FEATURE 2: STARTUP PROBE
          # =========================================
          startupProbe:
            exec:
              command:
              - mongo
              - --eval
              - "db.adminCommand('ping')"
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          
          # =========================================
          # FEATURE 3: READINESS PROBE
          # =========================================
          readinessProbe:
            exec:
              command:
              - mongo
              - --eval
              - "db.adminCommand('ping')"
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # =========================================
          # FEATURE 4: LIVENESS PROBE
          # =========================================
          livenessProbe:
            exec:
              command:
              - mongo
              - --eval
              - "db.adminCommand('ping')"
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          # =========================================
          # FEATURE 5: PRE-STOP HOOK
          # =========================================
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - |
                  echo "🛑 Flushing MongoDB writes to disk..."
                  mongo --eval "db.fsyncLock()"
                  sleep 10
                  mongo --eval "db.fsyncUnlock()"
                  echo "✅ MongoDB shutdown complete"
          
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      
      volumes:
        - name: mongo-data
          emptyDir: {}
      
      # =========================================
      # FEATURE 6: TERMINATION GRACE PERIOD
      # =========================================
      terminationGracePeriodSeconds: 120

