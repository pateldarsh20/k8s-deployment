# ==================== USER SERVICE ====================
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: habit-tracker
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 3001

# ==================== HABIT SERVICE ====================
apiVersion: v1
kind: Service
metadata:
  name: habit-service
  namespace: habit-tracker
spec:
  selector:
    app: habit-service
  ports:
    - port: 3002
      targetPort: 3002

# ==================== TRACKING SERVICE ====================
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: habit-tracker
spec:
  selector:
    app: tracking-service
  ports:
    - port: 3003
      targetPort: 3003

# ==================== ANALYTICS SERVICE ====================
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: habit-tracker
spec:
  selector:
    app: analytics-service
  ports:
    - port: 3004
      targetPort: 3004

# ==================== NOTIFICATION SERVICE ====================
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: habit-tracker
spec:
  selector:
    app: notification-service
  ports:
    - port: 3005
      targetPort: 3005

# ==================== API GATEWAY ====================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: habit-tracker
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080

